services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptimewatch
      POSTGRES_USER: uptimewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimewatch -d uptimewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: uptimewatch:local
    environment:
      DATABASE_URL: postgresql+psycopg://uptimewatch:${POSTGRES_PASSWORD}@db:5432/uptimewatch
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    image: uptimewatch:local
    command: ["python", "-m", "app.checker"]
    environment:
      DATABASE_URL: postgresql+psycopg://uptimewatch:${POSTGRES_PASSWORD}@db:5432/uptimewatch
      CHECK_INTERVAL_SECONDS: "30"
    ports:
      - "9101:9101"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
